<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اسأل عن Ooredoo فلسطين (غير رسمي)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef2f4; --surface: #ffffff; --ink: #16232e; --muted: #5b6b78;
    --line: #d5dde2; --accent: #0a6e6e; --accent-ink: #ffffff; --accent-soft: #d9eeee; --danger: #a32121;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1a21; --surface: #17252e; --ink: #e8eef2; --muted: #93a4b1; --line: #2a3b46; --accent: #4cc2c2; --accent-ink: #08262a; --accent-soft: #19393d; --danger: #ff9a9a; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; line-height: 1.7; }
  .app { max-width: 760px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding: 0 16px; }
  header { padding: 28px 0 14px; }
  h1 { font-size: 1.6rem; line-height: 1.3; margin: 0 0 6px; font-weight: 700; }
  .note { margin: 0; color: var(--muted); font-size: .92rem; }
  #log { flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 12px 0 20px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font: inherit; font-size: .92rem; color: var(--accent); background: transparent; border: 1px solid var(--accent); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .chip:hover { background: var(--accent-soft); }
  .msg { max-width: 92%; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-start; background: var(--accent); color: var(--accent-ink); padding: 10px 16px; border-radius: 16px 16px 16px 4px; }
  .bot { align-self: flex-end; background: var(--surface); border: 1px solid var(--line); padding: 12px 16px; border-radius: 16px 16px 4px 16px; }
  .bot.error { color: var(--danger); }
  .src { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: .85rem; color: var(--muted); white-space: normal; }
  .src a { color: var(--accent); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; text-align: right; }
  .typing { color: var(--muted); }
  form { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0 16px; }
  .row { display: flex; gap: 8px; }
  input { flex: 1; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .send { font: inherit; font-weight: 500; color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 12px; padding: 0 22px; cursor: pointer; }
  .send:disabled { opacity: .5; cursor: default; }
  footer { color: var(--muted); font-size: .8rem; padding: 0 0 6px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>اسأل عن Ooredoo فلسطين</h1>
    <p class="note">موقع غير رسمي وغير تابع لشركة Ooredoo. الإجابات مأخوذة من ooredoo.ps وقد تتأخر عن آخر تحديث، فتأكد من الأسعار والعروض في الموقع الرسمي.</p>
  </header>

  <main id="log" aria-live="polite">
    <div class="chips" id="chips">
      <button class="chip" type="button">ما هي باقات الإنترنت المتوفرة؟</button>
      <button class="chip" type="button">كيف أشحن رصيدي؟</button>
      <button class="chip" type="button">أين أقرب فرع؟</button>
      <button class="chip" type="button">ما الفرق بين الدفع المسبق والآجل؟</button>
    </div>
  </main>

  <form id="form">
    <div class="row">
      <input id="q" type="text" maxlength="300" placeholder="اكتب سؤالك هنا" autocomplete="off" aria-label="سؤالك">
      <button class="send" id="send" type="submit">إرسال</button>
    </div>
  </form>
  <footer id="stamp"></footer>
</div>

<script>
  const log = document.getElementById('log'), form = document.getElementById('form'),
        input = document.getElementById('q'), send = document.getElementById('send'),
        stamp = document.getElementById('stamp');

  function add(cls, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = text;
    log.appendChild(d);
    d.scrollIntoView({ block: 'end', behavior: 'smooth' });
    return d;
  }

  async function ask(question) {
    document.getElementById('chips')?.remove();
    add('user', question);
    const wait = add('bot typing', 'جارٍ البحث في معلومات الموقع...');
    send.disabled = true;
    try {
      const res = await fetch('/api/chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ question }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'حدث خطأ غير متوقع.');
      wait.className = 'msg bot';
      wait.textContent = data.answer;
      if (data.sources?.length) {
        const s = document.createElement('div');
        s.className = 'src';
        s.append('المصادر:');
        for (const x of data.sources) {
          const a = document.createElement('a');
          a.href = x.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = x.url;
          s.appendChild(a);
        }
        wait.appendChild(s);
      }
      if (data.updatedAt) stamp.textContent = 'آخر تحديث للمعلومات: ' + new Date(data.updatedAt).toLocaleDateString('ar');
    } catch (e) {
      wait.className = 'msg bot error';
      wait.textContent = e.message;
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    input.value = '';
    ask(q);
  });
  document.getElementById('chips').addEventListener('click', e => {
    if (e.target.classList.contains('chip')) ask(e.target.textContent);
  });
</script>
</body>
</html>
